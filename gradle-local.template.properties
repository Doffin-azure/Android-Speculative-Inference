# Copy this file to `gradle-local.properties` for machine-local settings.
# This file is safe to commit as a template; `gradle-local.properties` is ignored.
# Resolution order in the project is:
# 1. -PllamaCppSourceDir=...
# 2. gradle-local.properties -> llamaCppSourceDir=...
# 3. environment variable LLAMA_CPP_SRC
#
# Recommendation:
# Use a short local checkout path on Windows, for example:
# llamaCppSourceDir=C:\\src\\llama.cpp
# This reduces the chance of CMake object-path warnings.

# Example:
# llamaCppSourceDir=C:\\dev\\llama.cpp
