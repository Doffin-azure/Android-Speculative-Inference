<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="2026-05-08 Qwen memory comparison">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-family="Times New Roman, SimSun, serif" font-size="22" font-weight="700">2026-05-08 Qwen 实验内存占用对比</text>
  <text x="480" y="62" text-anchor="middle" font-family="Times New Roman, SimSun, serif" font-size="14" fill="#555">Android: TOTAL PSS；桌面: 实验相关进程 Working Set 峰值</text>

  <line x1="100" y1="430" x2="890" y2="430" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="90" x2="100" y2="430" stroke="#333" stroke-width="1.5"/>

  <g font-family="Times New Roman, SimSun, serif" font-size="13" fill="#444">
    <text x="92" y="434" text-anchor="end">0</text>
    <text x="92" y="369" text-anchor="end">2000</text>
    <text x="92" y="304" text-anchor="end">4000</text>
    <text x="92" y="239" text-anchor="end">6000</text>
    <text x="92" y="174" text-anchor="end">8000</text>
    <text x="92" y="109" text-anchor="end">10000</text>
  </g>

  <g stroke="#d0d0d0" stroke-dasharray="5 5">
    <line x1="100" y1="365" x2="890" y2="365"/>
    <line x1="100" y1="300" x2="890" y2="300"/>
    <line x1="100" y1="235" x2="890" y2="235"/>
    <line x1="100" y1="170" x2="890" y2="170"/>
    <line x1="100" y1="105" x2="890" y2="105"/>
  </g>

  <g font-family="Times New Roman, SimSun, serif" font-size="14">
    <rect x="270" y="84" width="18" height="18" fill="#3b73b9"/>
    <text x="296" y="98">Android 峰值 PSS</text>
    <rect x="435" y="84" width="18" height="18" fill="#d08b2f"/>
    <text x="461" y="98">桌面峰值工作集</text>
  </g>

  <!-- scale: 10000 MB -> 325 px, baseline y=430 -->
  <g font-family="Times New Roman, SimSun, serif">
    <text x="215" y="462" text-anchor="middle" font-size="15">端侧本地 7B</text>
    <rect x="185" y="279.9" width="42" height="150.1" fill="#3b73b9"/>
    <text x="206" y="270" text-anchor="middle" font-size="13">4618</text>

    <text x="480" y="462" text-anchor="middle" font-size="15">云侧本地投机</text>
    <rect x="490" y="94.3" width="42" height="335.7" fill="#d08b2f"/>
    <text x="511" y="84" text-anchor="middle" font-size="13">10329</text>

    <text x="745" y="462" text-anchor="middle" font-size="15">跨设备投机</text>
    <rect x="705" y="410.8" width="42" height="19.2" fill="#3b73b9"/>
    <text x="726" y="402" text-anchor="middle" font-size="13">591</text>
    <rect x="755" y="105.4" width="42" height="324.6" fill="#d08b2f"/>
    <text x="776" y="96" text-anchor="middle" font-size="13">9986</text>
  </g>

  <text x="34" y="260" transform="rotate(-90 34 260)" text-anchor="middle" font-family="Times New Roman, SimSun, serif" font-size="15">峰值内存（MB）</text>
  <text x="480" y="500" text-anchor="middle" font-family="Times New Roman, SimSun, serif" font-size="12" fill="#666">注：云侧本地桌面工作集包含 WSL 运行时基础占用，仅用于本次复跑的资源观察。</text>
</svg>
